services:
  app:
    # 镜像来自阿里云容器镜像服务（ACR）。本地开发想用本地构建的镜像时：
    #   MOWEN_APP_IMAGE=mowen-app:latest docker compose up -d
    image: ${MOWEN_APP_IMAGE:-crpi-9pf9lin5vvnxq7uh.cn-hangzhou.personal.cr.aliyuncs.com/ininyumo/mowen-agent:latest}
    container_name: mowen-app
    ports:
      - "127.0.0.1:8001:80"    # 只绑定本地，由宿主机 Nginx 反代
    volumes:
      # Docker Socket：沙盒模式需要（由本容器创建/管理兄弟沙盒容器）
      - /var/run/docker.sock:/var/run/docker.sock
      # 沙盒工作区：该路径会作为 bind 源交给宿主机 Docker，所以**容器内外必须是同一个绝对路径**，
      # 否则宿主机上找不到、Docker 会新建空目录，沙盒数据就落到部署目录之外了。
      # 宿主机上不存在时 Docker 会自动创建；也可以自己 mkdir 好再挂。
      - ${MOWEN_SANDBOX_WORKSPACE:-/srv/mowen-sandbox}:${MOWEN_SANDBOX_WORKSPACE:-/srv/mowen-sandbox}
      # 数据持久化
      - ./data:/app/data
      - ./downloads:/app/downloads
      - ./uploads:/app/uploads
      - ./vectorstore:/app/vectorstore
      - ./logs:/app/logs
      # 技能目录
      - ./skills:/app/skills
      - ./.agents/skills:/app/.agents/skills
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      # 定时任务用容器本地时区解析 cron（调度器未显式指定时区）。
      # 容器默认是 UTC，不加这行「每天 9:00」会在北京时间 17:00 触发。
      - TZ=Asia/Shanghai
      # 沙盒镜像不在 compose 的服务列表里（它是运行时由宿主机 Docker 创建的兄弟容器），
      # 所以 compose 不会替你拉取——部署前先在宿主机执行：
      #   docker pull crpi-9pf9lin5vvnxq7uh.cn-hangzhou.personal.cr.aliyuncs.com/ininyumo/mowen-sandbox:latest
      # 拉不到时应用会告警并回退到 python:3.12-slim（技能里承诺的预装包会缺失）。
      - MOWEN_SANDBOX_IMAGE=${MOWEN_SANDBOX_IMAGE:-crpi-9pf9lin5vvnxq7uh.cn-hangzhou.personal.cr.aliyuncs.com/ininyumo/mowen-sandbox:latest}
      # 沙盒工作区根目录：必须与上面挂载的路径一致（容器内外同一绝对路径）
      - MOWEN_SANDBOX_WORKSPACE=${MOWEN_SANDBOX_WORKSPACE:-/srv/mowen-sandbox}
    restart: unless-stopped
    # 资源限制：2核4G 服务器。注意镜像内带 Playwright 的 Chrome，
    # 用到浏览器 MCP 时内存占用会明显上升，可按需调高。
    deploy:
      resources:
        limits:
          memory: 2G
    # 加入已有外部网络（npm_default）
    networks:
      - npm_default
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  npm_default:
    external: true
